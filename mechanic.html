<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mechanic App</title><style>*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#111;color:#fff}.head{background:#ffcc00;color:#000;padding:15px;text-align:center;font-weight:bold;position:sticky;top:0}.card{background:#222;border:1px solid #333;border-radius:14px;padding:14px;margin:12px auto;max-width:450px}.btn{width:100%;padding:13px;border:0;border-radius:10px;font-weight:bold;margin-top:8px;cursor:pointer}.btnG{background:#00c853;color:#fff}.btnR{background:#ff3d00;color:#fff}.btnB{background:#2962ff;color:#fff}.new{background:#ffeb3b;color:#000;animation:blink 1s infinite}.accepted{background:#00e676;color:#000}.on_the_way{background:#00bcd4;color:#000}.done{background:#555}@keyframes blink{50%{opacity:.5}}input{width:100%;padding:12px;border-radius:10px;border:1px solid #444;background:#222;color:#fff;margin:6px 0}.badge{padding:4px 10px;border-radius:20px;font-size:12px;font-weight:bold;float:right}</style></head><body>
<div class="head">🔧 Mechanic Partner <button onclick="soundOn()" id="sBtn" style="float:right;background:#000;color:#ffcc00;border:0;padding:6px 12px;border-radius:20px">🔔 Sound ON</button></div>
<div id="login" style="max-width:450px;margin:auto;padding:20px"><div class="card"><h3>Login</h3><input id="mname" value="Raju Mechanic"><input id="mphone" value="8700406006"><button class="btn" style="background:#ffcc00;color:#000" onclick="login()">Login</button></div></div>
<div id="dash" style="display:none;max-width:450px;margin:auto"><div class="card" style="display:flex;justify-content:space-between;text-align:center"><div><small>Earning</small><h2 id="earn">₹0</h2></div><div><small>Jobs</small><h2 id="jobs">0</h2></div><div><small>Sound</small><h3 id="sSt" style="color:#ff3d00">OFF</h3></div></div><div id="list"></div></div>
<audio id="bell" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" loop preload="auto"></audio>
<script>
let books=[],last=0,sOn=false;
function soundOn(){sOn=true;let a=document.getElementById('bell');a.play().then(()=>{a.pause();document.getElementById('sSt').innerText='ON';document.getElementById('sSt').style.color='#00e676';document.getElementById('sBtn').innerText='🔔 ON';alert('Ghanti ON!')});if(Notification&&Notification.permission!="granted")Notification.requestPermission()}
function login(){document.getElementById('login').style.display='none';document.getElementById('dash').style.display='block';load();setInterval(load,2000);soundOn()}
function load(){let d=localStorage.getItem('mechanic_bookings');let nb=d?JSON.parse(d):[];if(nb.length>last&&last!=0)ring(nb[nb.length-1]);last=nb.length;books=nb;render()}
function ring(b){if(!sOn)return;let a=document.getElementById('bell');a.currentTime=0;a.play();if(navigator.vibrate)navigator.vibrate([500,200,500]);if(Notification&&Notification.permission=="granted")new Notification("🔔 New Booking",{body:b.name+" - "+b.vehicle});alert("🔔 NAYI BOOKING!\n"+b.name+" - "+b.vehicle+"\n"+b.address);setTimeout(()=>a.pause(),8000)}
function render(){let h='';if(books.length==0)h='<div class="card" style="text-align:center;color:#777">Koi booking nahi</div>';books.slice().reverse().forEach(b=>{h+=`<div class="card" style="${b.status=='new'?'border:2px solid #ffeb3b':''}"><span class="badge ${b.status}">${b.status}</span><b>${b.vehicle} - ₹${b.price}</b><p style="font-size:14px">👤 ${b.name} - <a href="tel:${b.phone}" style="color:#ffcc00">${b.phone}</a><br>📍 ${b.address}<br>🕒 ${b.time}</p><div style="display:flex;gap:8px;flex-wrap:wrap">${b.status=='new'?`<button class="btn btnG" onclick="upd(${b.id},'accepted')">✅ ACCEPT</button><button class="btn btnR" onclick="upd(${b.id},'rejected')">❌ Reject</button>`:''}${b.status=='accepted'?`<button class="btn btnB" onclick="window.open('tel:${b.phone}')">📞 Call</button><button class="btn btnG" style="background:#00bcd4" onclick="upd(${b.id},'on_the_way')">🛵 Raste Me</button>`:''}${b.status=='on_the_way'?`<button class="btn btnG" onclick="upd(${b.id},'done')">✔️ Done</button>`:''}${b.status=='done'?`<p style="color:#00e676">✅ Done</p>`:''}</div></div>`});document.getElementById('list').innerHTML=h;let d=books.filter(x=>x.status=='done');document.getElementById('earn').innerText='₹'+d.reduce((s,x)=>s+x.price,0);document.getElementById('jobs').innerText=books.length}
function upd(id,st){document.getElementById('bell').pause();books=books.map(b=>b.id==id?{...b,status:st}:b);localStorage.setItem('mechanic_bookings',JSON.stringify(books));render()}
</script></body></html>
