<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mechanic - MechanicMitra</title><style>*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#111;color:#fff}.head{background:#ffcc00;color:#000;padding:14px;text-align:center;font-weight:bold;position:sticky;top:0}.card{background:#222;border:1px solid #333;border-radius:14px;padding:14px;margin:12px auto;max-width:450px}.btn{width:100%;padding:13px;border:0;border-radius:10px;font-weight:bold;margin-top:8px;cursor:pointer}.btnG{background:#00c853;color:#fff}.btnR{background:#ff3d00;color:#fff}.btnB{background:#2962ff;color:#fff}input{width:100%;padding:12px;border-radius:10px;border:1px solid #444;background:#222;color:#fff;margin:6px 0}.badge{padding:3px 10px;border-radius:20px;font-size:12px;font-weight:bold}.new{background:#ffeb3b;color:#000}.accepted{background:#00e676;color:#000}.done{background:#555}</style></head><body>
<div class="head">🔧 MechanicMitra - Partner App</div>
<div id="login" style="max-width:450px;margin:auto;padding:20px"><div class="card"><h3>Mechanic Login</h3><input id="mname" placeholder="Naam - Raju" value="Raju Mechanic"><input id="mphone" placeholder="Mobile" value="8700406006"><button class="btn btnG" onclick="login()">Login → Dashboard</button></div></div>
<div id="dash" style="display:none;max-width:450px;margin:auto"><div class="card" style="display:flex;justify-content:space-between"><div><small>Earnings</small><h2 id="earn">₹0</h2></div><div><small>Jobs</small><h2 id="jobs">0</h2></div><div><small>Rating</small><h2>4.8★</h2></div></div><div id="list"></div><div class="card" style="text-align:center"><button class="btn" style="background:#333;color:#fff" onclick="localStorage.removeItem('mechanic_bookings');location.reload()">🗑️ Clear Test Data</button></div></div>
<script>
let bookings=[];function login(){document.getElementById('login').style.display='none';document.getElementById('dash').style.display='block';load();setInterval(load,3000)}
function load(){let r=localStorage.getItem('mechanic_bookings');bookings=r?JSON.parse(r):[];if(bookings.length==0){bookings=[{id:1,name:'Sudhir Rai',phone:'8700406006',vehicle:'Bike - Puncture - ₹199',price:199,location:'https://maps.google.com/?q=28.53,77.27',address:'Okhla Phase-2',status:'new',time:new Date().toLocaleString()}]}render()}
function render(){let h='';if(bookings.length==0)h='<div class="card" style="text-align:center;color:#777">Koi booking nahi</div>';bookings.slice().reverse().forEach(b=>{h+=`<div class="card"><div style="display:flex;justify-content:space-between"><b>${b.vehicle}</b><span class="badge ${b.status}">${b.status}</span></div><p style="margin:8px 0">👤 ${b.name} - <a href="tel:${b.phone}" style="color:#ffcc00">${b.phone}</a><br>📍 ${b.address}<br><small>${b.time}</small></p><a href="${b.location}" target="_blank" style="color:#2962ff">🗺️ Location</a><div style="display:flex;gap:8px;margin-top:10px">${b.status=='new'?`<button class="btn btnG" onclick="upd(${b.id},'accepted')">✅ Accept</button><button class="btn btnR" onclick="upd(${b.id},'rejected')">❌ Reject</button>`:''}${b.status=='accepted'?`<button class="btn btnB" onclick="window.open('tel:${b.phone}')">📞 Call</button><button class="btn btnG" onclick="upd(${b.id},'done')">✔️ Done</button>`:''}</div></div>`});document.getElementById('list').innerHTML=h;let d=bookings.filter(b=>b.status=='done');document.getElementById('earn').innerText='₹'+d.reduce((s,b)=>s+b.price,0);document.getElementById('jobs').innerText=bookings.length}
function upd(id,st){bookings=bookings.map(b=>b.id==id?{...b,status:st}:b);localStorage.setItem('mechanic_bookings',JSON.stringify(bookings));render()}
</script></body></html>
