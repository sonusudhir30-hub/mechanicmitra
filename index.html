<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MechanicMitra</title>
<style>
body{font-family: sans-serif; background:#fff; margin:0; padding:20px;}
.top{display:flex; justify-content:space-between; align-items:center;}
.back{background:#000; color:#fff; border:none; border-radius:20px; padding:8px 18px; font-weight:bold;}
.lang{border:2px solid #000; padding:6px 10px; border-radius:8px; font-weight:bold;}
.center{text-align:center; margin-top:10px;}
.logo{width:160px; height:auto;}
.input{width:100%; padding:15px; border-radius:12px; border:1px solid #ddd; background:#eef3ff; margin-top:6px; box-sizing:border-box; font-size:16px;}
.captcha{border:1px solid #ddd; padding:14px; border-radius:10px; margin-top:15px; display:flex; justify-content:space-between; align-items:center;}
.btn{width:100%; background:#e65100; color:#fff; padding:16px; border:none; border-radius:12px; margin-top:20px; font-size:18px; font-weight:bold;}
#otpBox{display:none; margin-top:20px; background:#fff8f0; padding:15px; border-radius:12px; border:1px dashed #ff6a00;}
</style>
</head>
<body>

<div class="top">
  <button class="back">← BACK</button>
  <select class="lang" id="langSelect" onchange="changeLang()">
    <option value="en">English</option>
    <option value="hi">हिन्दी</option>
    <option value="bn">বাংলা</option>
    <option value="mr">मराठी</option>
    <option value="ta">தமிழ்</option>
    <option value="te">తెలుగు</option>
    <option value="gu">ગુજરાતી</option>
  </select>
</div>

<div class="center">
  <img src="logo.png" class="logo" alt="MechanicMitra Logo">
  <h2 id="t_register" style="margin:10px 0 5px 0; letter-spacing:2px;">REGISTER</h2>
  <p id="t_sub" style="color:gray; margin:0;">Create your account</p>
</div>

<div style="margin-top:25px;">
  <label id="t_mob"><b>Mobile Number *</b></label>
  <input id="mobile" class="input" type="number" placeholder="Enter 10 digit number" value="8700406006">
</div>

<div class="captcha">
  <label><input type="checkbox" id="captchaCheck"> <span id="t_captcha">I'm not a robot</span></label>
  <span style="color:gray; font-size:12px;">reCAPTCHA</span>
</div>

<button class="btn" onclick="sendOTP()" id="t_btn">Send OTP →</button>

<div id="otpBox">
  <label><b id="t_otp">Enter OTP *</b> <span style="color:green;" id="t_autoread">(Auto-reading...)</span></label>
  <input id="otp_input" class="input" style="background:#fff; border-color:orange;" type="number" placeholder="123456">
  <button class="btn" style="background:green;" onclick="verifyOTP()" id="t_verify">Verify & Login</button>
</div>

<div id="success" style="display:none; text-align:center; margin-top:60px;">
  <img src="logo.png" style="width:100px;">
  <h1 style="color:green;">Login Successful!</h1>
</div>

<script>
const L = {
en:{register:"REGISTER", sub:"Create your account", mob:"Mobile Number *", captcha:"I'm not a robot", btn:"Send OTP →", otp:"Enter OTP *", autoread:"(Auto-reading...)", verify:"Verify & Login"},
hi:{register:"रजिस्टर", sub:"अपना अकाउंट बनाएं", mob:"मोबाइल नंबर *", captcha:"मैं रोबोट नहीं हूँ", btn:"OTP भेजें →", otp:"OTP दर्ज करें *", autoread:"(ऑटो पढ़ रहा है...)", verify:"सत्यापित करें"},
bn:{register:"রেজিস্টার", sub:"আপনার অ্যাকাউন্ট তৈরি করুন", mob:"মোবাইল নম্বর *", captcha:"আমি রোবট নই", btn:"OTP পাঠান →", otp:"OTP লিখুন *", autoread:"(অটো পড়ছে...)", verify:"যাচাই করুন"},
mr:{register:"नोंदणी", sub:"तुमचे खाते तयार करा", mob:"मोबाइल नंबर *", captcha:"मी रोबोट नाही", btn:"OTP पाठवा →", otp:"OTP टाका *", autoread:"(ऑटो वाचत आहे...)", verify:"पडताळणी करा"},
ta:{register:"பதிவு", sub:"உங்கள் கணக்கை உருவாக்கவும்", mob:"மொபைல் எண் *", captcha:"நான் ரோபோட் இல்லை", btn:"OTP அனுப்பு →", otp:"OTP உள்ளிடவும் *", autoread:"(தானாக படிக்கிறது...)", verify:"சரிபார்க்கவும்"},
te:{register:"నమోదు", sub:"మీ ఖాతాను సృష్టించండి", mob:"మొబైల్ నంబర్ *", captcha:"నేను రోబోట్ కాదు", btn:"OTP పంపండి →", otp:"OTP నమోదు చేయండి *", autoread:"(ఆటో రీడింగ్...)", verify:"ధృవీకరించండి"},
gu:{register:"રજિસ્ટર", sub:"તમારું એકાઉન્ટ બનાવો", mob:"મોબાઇલ નંબર *", captcha:"હું રોબોટ નથી", btn:"OTP મોકલો →", otp:"OTP દાખલ કરો *", autoread:"(ઓટો વાંચી રહ્યું છે...)", verify:"ચકાસો"}
};
function changeLang(){
  let l=document.getElementById('langSelect').value;
  document.getElementById('t_register').innerText=L[l].register;
  document.getElementById('t_sub').innerText=L[l].sub;
  document.getElementById('t_mob').innerText=L[l].mob;
  document.getElementById('t_captcha').innerText=L[l].captcha;
  document.getElementById('t_btn').innerText=L[l].btn;
  document.getElementById('t_otp').innerText=L[l].otp;
  document.getElementById('t_autoread').innerText=L[l].autoread;
  document.getElementById('t_verify').innerText=L[l].verify;
}
function sendOTP(){
  if(!document.getElementById('captchaCheck').checked){ alert("Pehle captcha tick karo"); return; }
  if(document.getElementById('mobile').value.length<10){ alert("Number sahi dalo"); return; }
  document.getElementById('otpBox').style.display="block";
  setTimeout(()=>{ document.getElementById('otp_input').value="123456"; verifyOTP(); }, 1500);
}
function verifyOTP(){
  if(document.getElementById('otp_input').value=="123456"){
    document.getElementById('success').style.display="block";
  } else { alert("123456 dalo"); }
}
</script>
</body>
</html>
