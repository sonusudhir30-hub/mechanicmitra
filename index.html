<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MechanicMitra</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
body{font-family:'Segoe UI',Arial;background:#f5f5f5;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.box{background:#fff;padding:30px;border-radius:12px;width:90%;max-width:380px;box-shadow:0 4px 20px rgba(0,0,0,0.1)}
h2{color:#ff6600;text-align:center;margin:0 0 20px}
label{font-weight:600;font-size:14px;display:block;text-align:left;margin-bottom:5px}
input{width:100%;padding:13px;margin:0 0 15px 0;border-radius:8px;border:1px solid #ddd;font-size:15px;box-sizing:border-box}
button{width:100%;padding:13px;background:#ff6600;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer}
button:hover{background:#e65c00}
#msg{text-align:center;margin-top:15px;font-size:14px}
.back{font-size:13px;background:#222;padding:8px 15px;border-radius:20px;color:#fff;display:inline-block;margin-bottom:20px;cursor:pointer}
</style>
</head>
<body>
<div class="box">
<div class="back" onclick="history.back()">← BACK</div>
<h2>MechanicMitra</h2>
<label>Mobile Number *</label>
<input type="tel" id="phone" placeholder="Enter 10 digit mobile number">
<div id="recaptcha-container" style="margin-bottom:15px"></div>
<button id="sendBtn" onclick="sendOTP()">Send OTP →</button>
<label id="otpLabel" style="display:none;margin-top:15px">Enter OTP *</label>
<input type="text" id="otp" placeholder="Enter 6 digit OTP" style="display:none">
<button id="verifyBtn" onclick="verifyOTP()" style="display:none">Verify & Continue</button>
<p id="msg"></p>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBq5uGrXWe03w8TMIm_vMFm968U91LMnhE",
  authDomain: "transport-mechanic.firebaseapp.com",
  projectId: "transport-mechanic",
  storageBucket: "transport-mechanic.firebasestorage.app",
  messagingSenderId: "261724000168",
  appId: "1:261724000168:web:c52856da1fdc994c8f579d",
  measurementId: "G-BCQE6KGLKP"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {'size':'normal'});
recaptchaVerifier.render();
let confirmationResult;

function sendOTP(){
  let phone = document.getElementById('phone').value.trim();
  if(phone.length==10) phone = "+91"+phone;
  const msg = document.getElementById('msg');
  msg.innerText = "Sending OTP...";
  auth.signInWithPhoneNumber(phone, window.recaptchaVerifier).then(result=>{
    confirmationResult=result;
    msg.innerText="OTP sent successfully";
    msg.style.color="green";
    document.getElementById('otp').style.display='block';
    document.getElementById('otpLabel').style.display='block';
    document.getElementById('verifyBtn').style.display='block';
    document.getElementById('sendBtn').style.display='none';
  }).catch(err=>{
    msg.innerText=err.message;
    msg.style.color="red";
  });
}
function verifyOTP(){
  const code=document.getElementById('otp').value;
  confirmationResult.confirm(code).then(()=>{
    document.getElementById('msg').innerText="Login Successful!";
    // window.location.href="dashboard.html";
  }).catch(err=>{
    document.getElementById('msg').innerText="Invalid OTP";
    document.getElementById('msg').style.color="red";
  });
}
</script>
</body>
</html>
