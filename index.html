<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MechanicMitra</title><style>body{margin:0;background:#ffcc00;font-family:Arial}.screen{position:fixed;inset:0;background:#ffcc00;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:16px;overflow:auto}.screen.on{display:flex}.logo{width:180px;height:180px;background:#fff;border-radius:50%;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.3)}.logo img{width:100%;height:100%;object-fit:cover}.btnM{background:#111;color:#fff;border:0;padding:16px 36px;border-radius:50px;font-weight:800;margin-top:20px}.card{background:#fff;width:92%;max-width:400px;border-radius:16px;padding:18px;margin:12px auto;text-align:left}.back{background:#111;color:#fff;border:0;padding:10px 16px;border-radius:20px;font-weight:bold;margin-bottom:12px}.btn{width:100%;padding:14px;background:#ff6600;color:#fff;border:0;border-radius:10px;font-weight:bold;margin-top:8px}.btn2{width:100%;padding:12px;background:#e8f5e9;color:#2e7d32;border:2px dashed #2e7d32;border-radius:10px;font-weight:bold;margin:6px 0}input,select{width:100%;padding:14px;border:2px solid #ddd;border-radius:10px;margin:6px 0;box-sizing:border-box}.v{border:2px solid #eee;border-radius:12px;padding:12px;text-align:center;font-weight:bold;cursor:pointer}.v.sel{border-color:#ff6600;background:#fff3e0}#locStatus{font-size:12px;color:green;font-weight:bold;text-align:center}</style></head><body>
<div id="s1" class="screen on"><div class="logo"><img src="IMG-20260918-WA0802.jpg"></div><h1 id="t1">MechanicMitra</h1><p id="t2">Quick Partner - 30 Min</p><button class="btnM" onclick="go(2)" id="b1">GET STARTED →</button></div>
<div id="s2" class="screen" style="background:#fff"><div class="card"><button class="back" onclick="goback()">← BACK</button><h3 id="t3">🌐 भाषा चुनो *</h3><select id="lang" onchange="changeLang(this.value)"><option value="">-- चुनो --</option><option value="hi">हिन्दी</option><option value="en">English</option><option value="mr">मराठी</option><option value="bn">বাংলা</option></select><button class="btn" onclick="next2()" id="b2">आगे बढ़ो →</button></div></div>
<div id="s3" class="screen" style="background:#fff"><div class="card"><button class="back" onclick="goback()">← BACK</button><h3 id="t4">📱 मोबाइल नंबर *</h3><input id="ph" maxlength="10" placeholder="10 अंकों का नंबर"><button class="btn" onclick="next3()" id="b3">OTP भेजो →</button></div></div>
<div id="s4" class="screen" style="background:#fff"><div class="card"><button class="back" onclick="goback()">← BACK</button><h3 id="t5">🔑 OTP - 1234 *</h3><input id="otp" maxlength="4" placeholder="1234"><button class="btn" onclick="next4()" id="b4">जाँच करो →</button></div></div>
<div id="s5" class="screen" style="background:#f5f5f5;display:none;justify-content:flex-start;padding-top:20px"><div class="card"><button class="back" onclick="goback()">← BACK</button><h3 id="t6">1. गाड़ी चुनो *</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="v" onclick="pick(this,'Bike')"><div style="font-size:32px">🏍️</div>Bike<br>₹149</div><div class="v" onclick="pick(this,'Scooty')"><div style="font-size:32px">🛵</div>Scooty<br>₹149</div><div class="v" onclick="pick(this,'Auto')"><div style="font-size:32px">🛺</div>Auto/EKA 6S<br>₹199</div><div class="v" onclick="pick(this,'Car')"><div style="font-size:32px">🚗</div>Car<br>₹299</div><div class="v" onclick="pick(this,'Truck')" style="grid-column:span 2"><div style="font-size:32px">🚚</div>Truck ₹499</div></div></div><div class="card"><h3 id="t7">2. आपकी जानकारी *</h3><input id="nm" placeholder="आपका नाम *"><button class="btn2" onclick="getLoc()">📍 मेरी Current Location Use करो</button><p id="locStatus"></p><input id="lc" placeholder="आपका पता / Location Link *"><button class="btn" onclick="book()" id="b5">📲 बुकिंग करो</button><p id="msg" style="color:green;font-weight:bold;text-align:center"></p></div></div>
<script>
let hist=[1],cur='hi',gv='',gLat='',gLon='';
let L={en:{t1:"MechanicMitra",t2:"Quick Partner - 30 Min",b1:"GET STARTED →",t3:"🌐 Choose Language *",b2:"Continue →",t4:"📱 Mobile Number *",b3:"Send OTP →",t5:"🔑 Enter OTP - 1234 *",b4:"Verify →",t6:"1. Choose Vehicle *",t7:"2. Your Details *",b5:"📲 Book Now",ph:"10 digit number",nm:"Your Name *",lc:"Your Location *",locBtn:"📍 Use My Current Location",locOk:"✅ Location Found!"},hi:{t1:"मैकेनिकमित्रा",t2:"तुरंत पार्टनर - 30 मिनट में",b1:"शुरू करो →",t3:"🌐 भाषा चुनो *",b2:"आगे बढ़ो →",t4:"📱 मोबाइल नंबर *",b3:"OTP भेजो →",t5:"🔑 OTP डालो - 1234 *",b4:"जाँच करो →",t6:"1. गाड़ी चुनो *",t7:"2. आपकी जानकारी *",b5:"📲 बुकिंग करो",ph:"10 अंकों का नंबर",nm:"आपका नाम *",lc:"आपका पता / Location Link *",locBtn:"📍 मेरी Current Location Use करो",locOk:"✅ Location मिल गई!"},mr:{t1:"मेकॅनिकमित्र",t2:"त्वरित पार्टनर - 30 मिनिटांत",b1:"सुरू करा →",t3:"🌐 भाषा निवडा *",b2:"पुढे चला →",t4:"📱 मोबाईल नंबर *",b3:"OTP पाठवा →",t5:"🔑 OTP टाका - 1234 *",b4:"पडताळणी करा →",t6:"1. गाडी निवडा *",t7:"2. तुमची माहिती *",b5:"📲 बुकिंग करा",ph:"10 अंकी नंबर",nm:"तुमचे नाव *",lc:"तुमचे ठिकाण / Location Link *",locBtn:"📍 माझे Current Location वापरा",locOk:"✅ Location मिळाले!"},bn:{t1:"মেকানিকমিত্র",t2:"দ্রুত পার্টনার - 30 মিনিটে",b1:"শুরু করুন →",t3:"🌐 ভাষা বেছে নিন *",b2:"এগিয়ে যান →",t4:"📱 মোবাইল নম্বর *",b3:"OTP পাঠান →",t5:"🔑 OTP দিন - 1234 *",b4:"যাচাই করুন →",t6:"1. গাড়ি বেছে নিন *",t7:"2. আপনার তথ্য *",b5:"📲 বুকিং করুন",ph:"10 সংখ্যার নম্বর",nm:"আপনার নাম *",lc:"আপনার অবস্থান / Location Link *",locBtn:"📍 আমার Current Location ব্যবহার করুন",locOk:"✅ Location পাওয়া গেছে!"}};
function changeLang(l){if(!l)return;cur=l;let d=L[l];t1.innerText=d.t1;t2.innerText=d.t2;b1.innerText=d.b1;t3.innerText=d.t3;b2.innerText=d.b2;t4.innerText=d.t4;b3.innerText=d.b3;t5.innerText=d.t5;b4.innerText=d.b4;t6.innerText=d.t6;t7.innerText=d.t7;b5.innerText=d.b5;ph.placeholder=d.ph;nm.placeholder=d.nm;lc.placeholder=d.lc;document.querySelector('.btn2').innerText=d.locBtn;}
function show(n){document.querySelectorAll('.screen').forEach(s=>{s.classList.remove('on');s.style.display='none'});let e=document.getElementById('s'+n);e.classList.add('on');e.style.display=n==5?'block':'flex';}
function go(n){hist.push(n);show(n);}function goback(){if(hist.length>1){hist.pop();show(hist[hist.length-1]);}else show(1);}
function next2(){if(!lang.value){alert('भाषा चुनो!');return}changeLang(lang.value);go(3);}
function next3(){if(ph.value.length!=10){alert('10 digit dalo!');return}go(4);}
function next4(){if(otp.value!='1234'){alert('OTP 1234 hai!');return}go(5);}
function pick(el,v){document.querySelectorAll('.v').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');gv=v;}
function getLoc(){
  let s=document.getElementById('locStatus');
  s.innerText='📡 Location ले रहा है... Allow करना!';
  if(!navigator.geolocation){s.innerText='❌ GPS support नहीं है';return;}
  navigator.geolocation.getCurrentPosition(pos=>{
    gLat=pos.coords.latitude; gLon=pos.coords.longitude;
    let link=`https://www.google.com/maps?q=${gLat},${gLon}`;
    document.getElementById('lc').value=link;
    s.innerHTML=`${L[cur].locOk}<br><a href="${link}" target="_blank">🗺️ Map pe Dekho</a>`;
  },err=>{
    s.innerText='❌ Location Allow करो! Setting me GPS on karo';
  },{enableHighAccuracy:true,timeout:10000});
}
function book(){
  if(!gv){alert('Gaadi chuno!');return}
  if(!nm.value.trim()){alert('Naam bharo!');return}
  if(!lc.value.trim()){alert('Location bharo ya Current Location button dabao!');return}
  let mapLink=gLat?`https://www.google.com/maps?q=${gLat},${gLon}`:lc.value;
  let m=`*NEW BOOKING - MechanicMitra*%0A%0AGaadi:${gv}%0ANaam:${nm.value}%0AMobile:${ph.value}%0ALocation:${mapLink}%0ALat:${gLat}, Lon:${gLon}%0A%0A_Google Map Link_%0A${mapLink}`;
  window.open('https://wa.me/918700406006?text='+m,'_blank');
  msg.innerText=cur=='mr'?'✅ Location ke saath Booking Sent!':'✅ Location ke saath Booking Bheji!';
}
</script></body></html>
