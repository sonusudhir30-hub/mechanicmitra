<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MechanicMitra - Quick Partner 30 Min</title>
<style>
*{box-sizing:border-box;font-family:sans-serif;margin:0;padding:0}
body{background:#fff;overflow:hidden}
.screen{position:fixed;inset:0;background:#fff;display:none;flex-direction:column;padding:20px;overflow:auto}
.screen.on{display:flex}
.card{width:100%;max-width:360px;margin:auto;background:#fff;border-radius:20px;padding:20px;box-shadow:0 8px 20px rgba(0,0,0,0.1);border:1px solid #eee}
.logo{width:90px;height:90px;border-radius:50%;margin:0 auto 10px;display:block;object-fit:cover}
input,select{width:100%;padding:15px;border:2px solid #eee;border-radius:12px;margin:8px 0;font-size:16px}
.btn{width:100%;padding:15px;border:none;border-radius:12px;background:#ff6600;color:#fff;font-weight:bold;font-size:16px;margin-top:12px}
.splash{background:#ffcc00!important;justify-content:center;align-items:center;text-align:center}
.bar{position:fixed;top:0;left:0;height:4px;background:#ff6600;z-index:999;width:14%}
.v{border:2px solid #eee;border-radius:12px;padding:12px;text-align:center}
.v.sel{border-color:#ff6600;background:#fff4e6}
</style>
</head>
<body>
<div class="bar" id="bar"></div>

<div id="s1" class="screen on splash">
<img src="IMG-20260918-WA0802.jpg" class="logo" style="width:130px;height:130px">
<h1>MechanicMitra</h1><p>Quick PARTNER - 30 Min</p>
<button class="btn" onclick="next(2)" style="max-width:200px;margin-top:25px">GET STARTED →</button>
</div>

<div id="s2" class="screen"><div class="card">
<img src="IMG-20260918-WA0802.jpg" class="logo" style="width:60px;height:60px">
<h2>Language / भाषा</h2>
<select id="lang"><option value="">-- Select --</option><option>Hindi</option><option>English</option></select>
<button class="btn" onclick="check2()">Continue →</button>
</div></div>

<div id="s3" class="screen"><div class="card">
<h2>Mobile Number</h2>
<input id="ph" type="tel" maxlength="10" placeholder="10 digit number">
<button class="btn" onclick="check3()">Send OTP →</button>
</div></div>

<div id="s4" class="screen"><div class="card">
<h2>OTP Daalo</h2><p>Demo OTP: 1234</p>
<input id="otp" type="tel" maxlength="4" placeholder="1234">
<button class="btn" onclick="check4()">Verify →</button>
</div></div>

<div id="s5" class="screen"><div class="card">
<h2>Aapka Naam?</h2>
<input id="cname" placeholder="Pura Naam">
<button class="btn" onclick="check5()">Next →</button>
</div></div>

<div id="s6" class="screen"><div class="card">
<h2>Terms</h2>
<div style="height:80px;overflow:auto;background:#f9f9f9;padding:8px;font-size:12px;border:1px solid #ddd;border-radius:8px">1. Bike Visiting ₹149, Car ₹299<br>2. 30 Min Service<br>3. Cancel pe charge</div>
<label style="display:flex;gap:8px;margin-top:10px"><input type="checkbox" id="ag" style="width:18px"> I Agree</label>
<button class="btn" onclick="check6()">Agree & Go →</button>
</div></div>

<div id="s7" class="screen" style="background:#f5f5f5;padding:0">
<div style="background:#111;color:#fff;padding:10px;display:flex;gap:8px;align-items:center"><img src="IMG-20260918-WA0802.jpg" style="width:30px;height:30px;border-radius:50%"><b>MechanicMitra</b></div>
<div style="padding:12px;width:100%;max-width:360px;margin:0 auto">
<div class="card">
<h3>Gaadi Chuno</h3>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px">
<div class="v" onclick="selV(this,'Bike')">🏍️<br><b>Bike</b>
