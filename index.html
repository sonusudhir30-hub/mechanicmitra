<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MechanicMitra</title><style>body{margin:0;background:#ffcc00;font-family:Arial}.screen{position:fixed;inset:0;background:#ffcc00;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center}.screen.on{display:flex}.logo{width:180px;height:180px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:70px;box-shadow:0 8px 20px rgba(0,0,0,.3)}.btnM{background:#111;color:#fff;border:0;padding:16px 36px;border-radius:50px;font-weight:800;margin-top:20px;font-size:18px}.card{background:#fff;width:90%;max-width:380px;border-radius:16px;padding:16px;margin:16px}.back{background:#111;color:#fff;border:0;padding:10px 16px;border-radius:20px;font-weight:bold;margin-bottom:12px}.btn{width:100%;padding:14px;background:#ff6600;color:#fff;border:0;border-radius:10px;font-weight:bold;margin-top:8px}input,select{width:100%;padding:14px;border:2px solid #ddd;border-radius:10px;margin:6px 0;box-sizing:border-box}.v{border:2px solid #eee;border-radius:12px;padding:12px;text-align:center;font-weight:bold}.v.sel{border-color:#ff6600;background:#fff3e0}</style></head><body>
<div id="s1" class="screen on"><div class="logo">🔧</div><h1>MechanicMitra</h1><p>Quick Partner - 30 Min</p><button class="btnM" onclick="go(2)">GET STARTED →</button></div>
<div id="s2" class="screen" style="background:#fff"><div class="card"><button class="back" onclick="goback()">← BACK</button><h3>🌐 भाषा चुनो *</h3><select id="lang"><option value="">-- चुनो --</option><option value="hi">हिन्दी</option><option value="en">English</option><option value="mr">मराठी</option><option value="bn">বাংলা</option></select><button class="btn" onclick="go(3)">Continue →</button></div></div>
<div id="s3" class="screen" style="background:#fff"><div class="card"><button class="back" onclick="goback()">← BACK</button><h3>📱 Mobile Number *</h3><input id="ph" maxlength="10" placeholder="10 digit"><button class="btn" onclick="go(4)">Send OTP →</button></div></div>
<div id="s4" class="screen" style="background:#fff"><div class="card"><button class="back" onclick="goback()">← BACK</button><h3>🔑 OTP - 1234 *</h3><input id="otp" maxlength="4" placeholder="1234"><button class="btn" onclick="go(5)">Verify →</button></div></div>
<div id="s5" class="screen" style="background:#f5f5f5;display:none;overflow:auto;justify-content:flex-start;padding-top:20px"><div class="card"><button class="back" onclick="goback()">← BACK</button><h3>1. Gaadi Chuno *</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="v" onclick="pick(this,'Bike')"><div style="font-size:32px">🏍️</div>Bike ₹149</div><div class="v" onclick="pick(this,'Scooty')"><div style="font-size:32px">🛵</div>Scooty ₹149</div><div class="v" onclick="pick(this,'Auto')"><div style="font-size:32px">🛺</div>Auto ₹199</div><div class="v" onclick="pick(this,'Car')"><div style="font-size:32px">🚗</div>Car ₹299</div><div class="v" onclick="pick(this,'Truck')" style="grid-column:span 2"><div style="font-size:32px">🚚</div>Truck ₹499</div></div></div><div class="card"><h3>2. Details *</h3><input id="nm" placeholder="Naam *"><input id="lc" placeholder="Location *"><button class="btn" onclick="book()">📲 Booking</button><p id="msg" style="color:green;font-weight:bold"></p></div></div>
<script>let h=[1];function show(n){document.querySelectorAll('.screen').forEach(s=>{s.classList.remove('on');s.style.display='none'});let e=document.getElementById('s'+n);e.classList.add('on');e.style.display=n==5?'block':'flex'}function go(n){h.push(n);show(n)}function goback(){if(h.length>1){h.pop();show(h[h.length-1])}else show(1)}let gv='';function pick(el,v){document.querySelectorAll('.v').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');gv=v}function book(){if(!gv){alert('Gaadi chuno');return}if(!nm.value.trim()){alert('Naam bharo');return}if(!lc.value.trim()){alert('Location bharo');return}let m='BOOKING%0AGaadi:'+gv+'%0ANaam:'+nm.value+'%0ALoc:'+lc.value;window.open('https://wa.me/918700406006?text='+m,'_blank');msg.innerText='✅ Sent!'}</script></body></html>
