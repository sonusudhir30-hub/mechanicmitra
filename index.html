<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MechanicMitra</title>
<style>body{margin:0;background:#ffcc00;font-family:Arial}.screen{position:fixed;inset:0;background:#ffcc00;display:none;align-items:center;justify-content:center;flex-direction:column;padding:16px;overflow:auto}.screen.on{display:flex}.logo{width:130px;height:130px;background:#fff;border-radius:50%;overflow:hidden}.logo img{width:100%;height:100%;object-fit:cover}.btnM{background:#111;color:#fff;border:0;padding:14px 30px;border-radius:50px;font-weight:800;margin-top:16px}.card{background:#fff;width:94%;max-width:420px;border-radius:16px;padding:16px;margin:10px auto;text-align:left}.back{background:#111;color:#fff;border:0;padding:8px 14px;border-radius:20px;font-weight:bold;margin-bottom:10px}.btn{width:100%;padding:14px;background:#ff6600;color:#fff;border:0;border-radius:12px;font-weight:bold;margin-top:8px;font-size:16px}.btn2{width:100%;padding:10px;background:#e8f5e9;color:#2e7d32;border:2px dashed #2e7d32;border-radius:10px;font-weight:bold;margin:6px 0}input,select{width:100%;padding:12px;border:2px solid #ddd;border-radius:10px;margin:6px 0;box-sizing:border-box}.v{border:2px solid #eee;border-radius:14px;padding:14px;text-align:center;font-weight:bold;cursor:pointer;background:#fff}.v.sel{border-color:#ff6600;background:#fff3e0}</style></head><body>

<div id="s1" class="screen on"><div class="logo"><img src="IMG-20260918-WA0802.jpg" onerror="this.src='https://via.placeholder.com/130'"></div><h2 id="t1">MechanicMitra</h2><p id="t2" style="font-weight:bold">30 Min me Mechanic</p><button class="btnM" onclick="goNext(2)" id="t3">GET STARTED →</button></div>

<div id="s2" class="screen" style="background:#fff"><div class="card"><button class="back" onclick="goBack()">← BACK</button><h3 id="t4">🌐 भाषा चुनो *</h3><select id="lang" onchange="changeLang()"><option value="hi">🇮🇳 हिन्दी</option><option value="en">🇬🇧 English</option><option value="mr">🚩 मराठी</option><option value="bho">🙏 भोजपुरी</option><option value="bn">🐅 बांग्ला</option><option value="gu">🦁 ગુજરાતી</option><option value="ta">🌴 தமிழ்</option></select><button class="btn" onclick="goNext(3)" id="t5">Continue →</button></div></div>

<div id="s3" class="screen" style="background:#fff"><div class="card"><button class="back" onclick="goBack()">← BACK</button><h3 id="t6">📱 Mobile Number *</h3><input id="ph" maxlength="10" type="tel" placeholder="10 digit number"><button class="btn" onclick="sendOtp()" id="t7">OTP भेजो →</button></div></div>

<div id="s4" class="screen" style="background:#fff"><div class="card"><button class="back" onclick="goBack()">← BACK</button><h3 id="t8">🔑 OTP Verification</h3><div style="background:#fff3e0;padding:10px;border-radius:10px;text-align:center">OTP: <b id="genOtp">----</b></div><input id="otp" placeholder="OTP"><button class="btn" onclick="verifyOtp()" id="t9">Verify →</button></div></div>

<div id="s5" class="screen" style="background:#f5f5f5;display:none;justify-content:flex-start"><div class="card"><button class="back" onclick="goBack()">← BACK</button><h3 id="t10">1. गाड़ी चुनो *</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="v" onclick="pickV(this,'Bike')">🏍️<br>Bike</div><div class="v" onclick="pickV(this,'Auto')">🛺<br>Auto</div><div class="v" onclick="pickV(this,'Car')">🚗<br>Car</div><div class="v" onclick="pickV(this,'Truck')">🚚<br>Truck</div></div></div><div class="card"><h3 id="t11">2. Problem क्या है? *</h3><select id="prob"><option value="">-- Select --</option><option>Puncture</option><option>Battery Dead</option><option>Engine Issue</option><option>Towing Needed</option><option>Full Service</option></select></div><div class="card"><h3 id="t13">3. Location *</h3><button class="btn2" onclick="getLoc()" id="t14">📍 Current Location</button><p id="locStatus" style="text-align:center;color:green;font-size:13px"></p><input id="lc" placeholder="Location Link"><input id="nm" placeholder="Your Name"><button class="btn" onclick="bookNow()" id="t15">🔧 Confirm Booking</button></div></div>

<div id="s6" class="screen" style="background:#fff;display:none"><div class="card" style="text-align:center;border:2px solid #ff6600"><h3 id="t16">✅ Booking Confirmed!</h3><h4 id="trackVehicle"></h4><a id="mapBtn" href="#" target="_blank" style="display:block;background:#ff6600;color:#fff;padding:12px;border-radius:10px;text-decoration:none;margin:8px 0">🗺️ Live Location</a><button class="btn" onclick="location.reload()" style="background:#111">Home</button></div></div>

<script>
let tr={hi:{t1:"MechanicMitra",t2:"30 मिनट में मैकेनिक आपके पास",t3:"शुरू करें →",t4:"🌐 भाषा चुनो *",t5:"आगे बढ़ें →",t6:"📱 मोबाइल नंबर *",t7:"OTP भेजो →",t8:"🔑 OTP सत्यापन",t9:"सत्यापित करें →",t10:"1. गाड़ी चुनो *",t11:"2. समस्या क्या है? *",t13:"3. लोकेशन *",t14:"📍 वर्तमान लोकेशन",t15:"🔧 बुकिंग कन्फर्म करो",t16:"✅ बुकिंग कन्फर्म!"},
en:{t1:"MechanicMitra",t2:"Mechanic in 30 Minutes",t3:"GET STARTED →",t4:"🌐 Choose Language *",t5:"Continue →",t6:"📱 Mobile Number *",t7:"Send OTP →",t8:"🔑 OTP Verification",t9:"Verify →",t10:"1. Choose Vehicle *",t11:"2. What is Problem? *",t13:"3. Location *",t14:"📍 Current Location",t15:"🔧 Confirm Booking",t16:"✅ Booking Confirmed!"},
mr:{t1:"MechanicMitra",t2:"30 मिनिटात मेकॅनिक",t3:"सुरू करा →",t4:"🌐 भाषा निवडा *",t5:"पुढे जा →",t6:"📱 मोबाईल नंबर *",t7:"OTP पाठवा →",t8:"🔑 OTP पडताळणी",t9:"पडताळा →",t10:"1. गाडी निवडा *",t11:"2. काय समस्या आहे? *",t13:"3. ठिकाण *",t14:"📍 सध्याचे ठिकाण",t15:"🔧 बुकिंग करा",t16:"✅ बुकिंग झाले!"},
bho:{t1:"MechanicMitra",t2:"30 मिनट में मिस्त्री आई",t3:"चालू करीं →",t4:"🌐 भाषा चुनीं *",t5:"आगे बढ़ीं →",t6:"📱 मोबाइल नंबर *",t7:"OTP भेजीं →",t8:"🔑 OTP जांच",t9:"जांच करीं →",t10:"1. गाड़ी चुनीं *",t11:"2. का दिक्कत बा? *",t13:"3. जगहा *",t14:"📍 अभी के जगहा",t15:"🔧 बुकिंग करीं",t16:"✅ बुकिंग हो गईल!"},
bn:{t1:"MechanicMitra",t2:"30 মিনিটে মেকানিক আসবে",t3:"শুরু করুন →",t4:"🌐 ভাষা বেছে নিন *",t5:"চালিয়ে যান →",t6:"📱 মোবাইল নম্বর *",t7:"OTP পাঠান →",t8:"🔑 OTP যাচাই",t9:"যাচাই করুন →",t10:"1. গাড়ি বেছে নিন *",t11:"2. সমস্যা কি? *",t13:"3. অবস্থান *",t14:"📍 বর্তমান অবস্থান",t15:"🔧 বুকিং করুন",t16:"✅ বুকিং সম্পন্ন!"},
gu:{t1:"MechanicMitra",t2:"30 મિનિટમાં મિકેનિક આવશે",t3:"શરૂ કરો →",t4:"🌐 ભાષા પસંદ કરો *",t5:"આગળ વધો →",t6:"📱 મોબાઈલ નંબર *",t7:"OTP મોકલો →",t8:"🔑 OTP ચકાસણી",t9:"ચકાસો →",t10:"1. વાહન પસંદ કરો *",t11:"2. શું સમસ્યા છે? *",t13:"3. સ્થાન *",t14:"📍 વર્તમાન સ્થાન",t15:"🔧 બુકિંગ કરો",t16:"✅ બુકિંગ થયું!"},
ta:{t1:"MechanicMitra",t2:"30 நிமிடத்தில் மெக்கானிக் வருவார்",t3:"தொடங்கு →",t4:"🌐 மொழியை தேர்வு செய் *",t5:"தொடரவும் →",t6:"📱 மொபைல் எண் *",t7:"OTP அனுப்பு →",t8:"🔑 OTP சரிபார்ப்பு",t9:"சரிபார் →",t10:"1. வாகனத்தை தேர்வு *",t11:"2. பிரச்சனை என்ன? *",t13:"3. இடம் *",t14:"📍 தற்போதைய இடம்",t15:"🔧 முன்பதிவு செய்",t16:"✅ முன்பதிவு ஆனது!"}};
function changeLang(){let l=lang.value;let d=tr[l];for(let k in d){let e=document.getElementById(k);if(e)e.innerText=d[k];}}
let hs=[1],gv='',otpR='',gLat='',gLon='';
function showScreen(n){document.querySelectorAll('.screen').forEach(s=>{s.classList.remove('on');s.style.display='none'});let e=document.getElementById('s'+n);e.classList.add('on');e.style.display=(n==5?'block':'flex');}
function goNext(n){hs.push(n);showScreen(n);}function goBack(){hs.pop();showScreen(hs[hs.length-1]);}
function sendOtp(){if(ph.value.length!=10){alert('10 digit dalo');return}otpR=Math.floor(1000+Math.random()*9000)+"";genOtp.innerText=otpR;goNext(4);setTimeout(()=>{otp.value=otpR;setTimeout(()=>verifyOtp(),500)},1500);}
function verifyOtp(){if(otp.value!=otpR&&otp.value!='1234'){alert('OTP: '+otpR);return}goNext(5);}
function pickV(el,v){document.querySelectorAll('.v').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');gv=v;}
function getLoc(){locStatus.innerText='Location le raha...';navigator.geolocation.getCurrentPosition(p=>{gLat=p.coords.latitude;gLon=p.coords.longitude;let l=`https://www.google.com/maps?q=${gLat},${gLon}`;lc.value=l;locStatus.innerHTML=`✅ OK <a href="${l}" target="_blank">Map</a>`;});}
function bookNow(){if(!gv||!prob.value||!nm.value||!lc.value){alert('Sab bharo');return}let ml=gLat?`https://www.google.com/maps?q=${gLat},${gLon}`:lc.value;trackVehicle.innerText=gv+' | '+prob.value;mapBtn.href=ml;let m=`NEW BOOKING\nVehicle:${gv}\nProblem:${prob.value}\nName:${nm.value}\nMob:${ph.value}\nLoc:${ml}`;window.open('https://wa.me/918700406006?text='+encodeURIComponent(m),'_blank');goNext(6);}showScreen(1);
</script></body></html>
