<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MechanicMitra</title>
<style>
*{box-sizing:border-box;font-family:sans-serif;margin:0;padding:0}
body{background:#ffcc00}
.screen{position:fixed;inset:0;background:#ffcc00;display:none;overflow:auto}
.screen.on{display:flex}
#s1{flex-direction:column;align-items:center;justify-content:center;text-align:center}
.logo{width:150px;height:150px;background:#fff;border-radius:50%;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.logo img{width:100%;height:100%;object-fit:contain}
.btn-main{background:#111;color:#fff;border:none;padding:18px 45px;border-radius:50px;font-size:18px;font-weight:800;margin-top:30px;width:85%;max-width:300px}
.card{background:#fff;border-radius:18px;padding:16px;margin:12px auto;width:95%;max-width:380px}
.back-btn{background:#111;color:#fff;border:none;padding:10px 18px;border-radius:25px;font-weight:bold;margin-bottom:12px}
.v{border:2px solid #eee;border-radius:12px;padding:12px;text-align:center}
.v.sel{border-color:#ff6600;background:#fff3e0}
input,select{width:100%;padding:14px;border:2px solid #eee;border-radius:10px;margin:6px 0}
input.error{border-color:red;background:#ffe6e6}
.btn{width:100%;padding:14px;background:#ff6600;color:#fff;border:none;border-radius:10px;font-weight:bold}
.err{color:red;font-size:12px;display:none;margin-top:4px}
</style></head><body>

<div id="s1" class="screen on">
<div class="logo"><img src="logo.jpg" onerror="this.parentElement.innerHTML='🔧'"></div>
<h1 style="margin-top:14px;font-weight:900">MechanicMitra</h1>
<p>Quick PARTNER - 30 Min</p>
<button class="btn-main" onclick="go(2)">GET STARTED →</button>
</div>

<div id="s2" class="screen" style="background:#fff;flex-direction:column;align-items:center;justify-content:center">
<div class="card">
<button class="back-btn" onclick="goBack()">← BACK</button>
<h2>🌐 Language Chuno</h2>
<select id="lang"><option value="">-- Select Karo --</option><option value="hi">हिन्दी</option><option value="en">English</option><option value="bn">বাংলা</option><option value="mr">मराठी</option><option value="ta">தமிழ்</option><option value="te">తెలుగు</option><option value="gu">ગુજરાતી</option></select>
<p id="err2" class="err">⚠️ Language select karo!</p>
<button class="btn" onclick="validateAndGo(2,3)">Continue →</button>
</div></div>

<div id="s3" class="screen" style="background:#fff;flex-direction:column;align-items:center;justify-content:center">
<div class="card">
<button class="back-btn" onclick="goBack()">← BACK</button>
<h2>📱 Mobile Number</h2>
<input id="ph" type="tel" maxlength="10" placeholder="10 digit number">
<p id="err3" class="err">⚠️ 10 digit mobile number dalo!</p>
<button class="btn" onclick="validateAndGo(3,4)">Send OTP →</button>
</div></div>

<div id="s4" class="screen" style="background:#fff;flex-direction:column;align-items:center;justify-content:center">
<div class="card">
<button class="back-btn" onclick="goBack()">← BACK</button>
<h2>🔑 OTP Daalo (1234)</h2>
<input id="otp" maxlength="4" placeholder="1234">
<p id="err4" class="err">⚠️ Sahi OTP 1234 dalo!</p>
<button class="btn" onclick="validateAndGo(4,5)">Verify →</button>
</div></div>

<div id="s5" class="screen" style="background:#f5f5f5;flex-direction:column">
<div class="card"><button class="back-btn" onclick="goBack()">← BACK</button><h3>1. Gaadi Chuno *
