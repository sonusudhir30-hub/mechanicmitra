<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MechanicMitra Customer</title><style>*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#f5f5f5}.header{background:#ffcc00;padding:15px;text-align:center;font-weight:bold;font-size:20px;position:sticky;top:0}.card{background:#fff;border-radius:14px;padding:15px;margin:12px auto;max-width:450px;box-shadow:0 2px 8px #0001}.btn{width:100%;padding:14px;border:0;border-radius:12px;font-weight:bold;font-size:16px;cursor:pointer;margin-top:10px}.btnY{background:#ffcc00}.vGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.vCard{border:2px solid #ddd;border-radius:12px;padding:12px;text-align:center;cursor:pointer}.vCard.active{border-color:#000;background:#ffcc00}input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #ccc;margin:6px 0}.trackStep{padding:10px;border-left:4px solid #ddd;margin:8px 0;background:#f9f9f9;border-radius:0 10px 10px 0}.trackStep.done{border-color:#00c853;background:#e8f5e9}.trackStep.active{border-color:#ffcc00;background:#fffde7}</style></head><body>
<div class="header">🔧 MechanicMitra</div>
<div id="form" style="max-width:450px;margin:auto;padding:10px">
<div class="card"><h3>Gaadi Chuno</h3><div class="vGrid">
<div class="vCard active" onclick="selV('Bike',199,this)">🏍️<br><b>Bike</b><br>₹199</div>
<div class="vCard" onclick="selV('Car',499,this)">🚗<br><b>Car</b><br>₹499</div>
<div class="vCard" onclick="selV('Scooty',199,this)">🛵<br><b>Scooty</b><br>₹199</div>
<div class="vCard" onclick="selV('Auto',299,this)">🛺<br><b>Auto</b><br>₹299</div>
</div></div>
<div class="card"><h3>Booking Details</h3>
<select id="prob"><option>Puncture</option><option>Engine Start Nahi</option><option>Battery Dead</option><option>Tow Service</option><option>Other</option></select>
<textarea id="addr" placeholder="Address likho - Okhla Phase 2"></textarea>
<input id="cname" placeholder="Aapka Naam"><input id="cphone" placeholder="Mobile Number">
<button class="btn btnY" onclick="bookNow()">🔧 Mechanic Bulao - ₹<span id="pShow">199</span></button>
</div></div>
<div id="trackBox" style="display:none;max-width:450px;margin:auto;padding:10px"><div class="card" style="border:2px solid #00c853"><h2 style="text-align:center;color:#00c853">📍 Live Tracking</h2><div id="tId" style="text-align:center;color:#777;font-size:12px"></div><div id="tStatus" style="margin-top:10px"></div><a id="callBtn" href="#" class="btn" style="background:#00c853;color:#fff;display:block;text-align:center;text-decoration:none;margin-top:10px">📞 Call Mechanic</a><a id="locBtn" href="#" target="_blank" class="btn" style="background:#2962ff;color:#fff;display:block;text-align:center;text-decoration:none;margin-top:8px">🗺️ Live Location</a><button class="btn" style="background:#333;color:#fff" onclick="localStorage.removeItem('last_booking_id');location.reload()">Nayi Booking</button></div></div>
<script>
let sV='Bike',sP=199;
function selV(v,p,el){sV=v;sP=p;document.getElementById('pShow').innerText=p;document.querySelectorAll('.vCard').forEach(c=>c.classList.remove('active'));el.classList.add('active')}
function bookNow(){let n=document.getElementById('cname').value,ph=document.getElementById('cphone').value,pr=document.getElementById('prob').value,ad=document.getElementById('addr').value;if(!n||ph.length<10){alert('Naam aur Mobile sahi likho');return}let b={id:Date.now(),name:n,phone:ph,vehicle:sV+' - '+pr,price:sP,location:'https://maps.google.com/?q=28.5355,77.2710',address:ad||'Delhi',time:new Date().toLocaleString(),status:'new',assigned:'Raju Mechanic'};let all=JSON.parse(localStorage.getItem('mechanic_bookings')||'[]');all.push(b);localStorage.setItem('mechanic_bookings',JSON.stringify(all));localStorage.setItem('last_booking_id',b.id);let msg=`NEW BOOKING%0A${n} - ${ph}%0A${sV} - ${pr} - ₹${sP}%0A${ad}`;window.open(`https://wa.me/918700406006?text=${msg}`,'_blank');showTrack(b.id)}
function showTrack(id){document.getElementById('form').style.display='none';document.getElementById('trackBox').style.display='block';document.getElementById('tId').innerText='ID: #'+id;loop(id);setInterval(()=>loop(id),2000)}
function loop(id){let all=JSON.parse(localStorage.getItem('mechanic_bookings')||'[]');let b=all.find(x=>x.id==id);if(!b)return;document.getElementById('callBtn').href='tel:8700406006';document.getElementById('locBtn').href=b.location;let order=['new','accepted','on_the_way','done'];let cur=order.indexOf(b.status);let steps=[{k:'new',t:'Booking Bheji Gayi'},{k:'accepted',t:'Mechanic ne Accept Kiya'},{k:'on_the_way',t:'Raste Me Hai'},{k:'done',t:'Kaam Ho Gaya'}];let h='';steps.forEach((s,i)=>{let cls=i<cur?'done':i==cur?'active':'';let ic=i<cur?'✅':i==cur?'🔄':'⏳';h+=`<div class="trackStep ${cls}"><b>${ic} ${s.t}</b><br><small>${i<=cur?b.status==s.k?'Abhi...':s.t:''}</small></div>`});document.getElementById('tStatus').innerHTML=h}
let last=localStorage.getItem('last_booking_id');if(last)showTrack(parseInt(last));
</script></body></html>
